# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/cd.yml — WarrantyGuard AI
#
# Continuous Deployment — runs on push to main branch ONLY.
# Builds Docker images, pushes to GitHub Container Registry (ghcr.io),
# then deploys to your server via SSH.
# ─────────────────────────────────────────────────────────────────────────────
name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Replace 'your-github-username' with your actual GitHub username/org
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/warrantyguard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/warrantyguard-frontend

jobs:

  # ── Build and Push Docker Images ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract git short SHA
        id: meta
        run: echo "sha_short=" >> $GITHUB_OUTPUT

      # ── Build & Push Backend ──────────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          # GitHub Actions cache — speeds up rebuilds on unchanged layers
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            REGISTRY=ghcr.io
            REPO=${{ github.repository_owner }}/warrantyguard-ai
            BASE_TAG=latest

      # ── Build & Push Frontend ─────────────────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy to Server ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            # Pull latest images
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest

            # Navigate to project directory on server
            cd /opt/warrantyguard

            # Update compose to use registry images (production compose override)
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Cleanup old images
            docker image prune -f
