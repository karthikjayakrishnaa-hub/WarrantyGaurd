# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/build-ml-base.yml — WarrantyGuard AI
#
# PURPOSE: Builds and publishes the heavy ML base Docker image to GitHub
# Container Registry (ghcr.io).
#
# Runs:
# 1. On demand via the "Run workflow" button in GitHub Actions (workflow_dispatch).
# 2. Automatically when docker/Dockerfile.base is modified on main.
# ─────────────────────────────────────────────────────────────────────────────
name: Build ML Base Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.base'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/warrantyguard-ai/ml-base

jobs:
  build-and-push-base:
    name: Build & Push ML Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ML base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.base
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=ml-base
          cache-to: type=gha,mode=max,scope=ml-base
